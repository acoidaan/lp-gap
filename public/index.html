<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LP GAP</title>
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔</text></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0e13;
        --card: #16171e;
        --card2: #1c1d26;
        --border: #2a2b35;
        --text: #e8e8e8;
        --dim: #6b6d7b;
        --faint: #3a3b47;
        --green: #49b26c;
        --red: #e85d75;
        --gold: #f0b232;
        --magenta: #d946ef;
        --cyan: #22d3ee;
        --input-bg: #1c1d26;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family:
          "Inter",
          -apple-system,
          sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 20px 80px;
      }

      /* Page layout: main col + sidebar */
      .page-layout {
        display: flex;
        gap: 24px;
        width: 100%;
        max-width: 940px;
        align-items: flex-start;
      }
      .main-col {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* Header */
      .header {
        text-align: center;
        margin-bottom: 40px;
        position: relative;
      }
      .header h1 {
        font-size: clamp(32px, 8vw, 56px);
        font-weight: 900;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        background: linear-gradient(135deg, #fff 30%, var(--gold));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }
      .header .sub {
        font-size: 12px;
        color: var(--dim);
        letter-spacing: 0.3em;
        text-transform: uppercase;
        margin-top: 6px;
      }

      /* Form */
      .form {
        width: 100%;
        max-width: 560px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 28px;
        margin-bottom: 24px;
      }
      .field {
        margin-bottom: 16px;
      }
      .field:last-of-type {
        margin-bottom: 20px;
      }
      .field label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.15em;
        color: var(--dim);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      input {
        width: 100%;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 16px;
        color: var(--text);
        font-family: inherit;
        font-size: 14px;
        font-weight: 500;
        outline: none;
        transition: border-color 0.2s;
      }
      input::placeholder {
        color: var(--faint);
      }
      input:focus {
        border-color: var(--gold);
      }

      .regions {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 6px;
      }
      .regions button {
        background: var(--bg);
        color: var(--dim);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 6px 14px;
        font-size: 12px;
        font-family: inherit;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.15s;
      }
      .regions button.active {
        background: var(--gold);
        color: #000;
        border-color: var(--gold);
      }
      .regions button:hover:not(.active) {
        border-color: var(--dim);
        color: var(--text);
      }

      .compare-btn {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, var(--gold), #e09400);
        color: #000;
        border: none;
        border-radius: 10px;
        font-size: 13px;
        font-family: inherit;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        cursor: pointer;
        transition: all 0.2s;
      }
      .compare-btn:disabled {
        opacity: 0.3;
        cursor: not-allowed;
        filter: grayscale(1);
      }
      .compare-btn:not(:disabled):hover {
        filter: brightness(1.1);
        transform: translateY(-1px);
      }

      /* Loading */
      .loading {
        text-align: center;
        margin-top: 32px;
        color: var(--dim);
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid var(--border);
        border-top-color: var(--gold);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin: 0 auto 16px;
      }

      /* Results */
      .results {
        width: 100%;
        max-width: 560px;
        animation: fadeUp 0.5s ease;
      }

      /* Gap card */
      .gap-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        margin-bottom: 12px;
        position: relative;
        overflow: hidden;
      }
      .gap-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--magenta), var(--gold));
      }
      .gap-card .label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.25em;
        color: var(--dim);
        text-transform: uppercase;
        margin-bottom: 8px;
      }
      .gap-card .value {
        font-size: clamp(40px, 10vw, 64px);
        font-weight: 900;
        color: var(--gold);
        line-height: 1;
      }
      .gap-card .leader {
        font-size: 12px;
        color: var(--dim);
        margin-top: 12px;
        letter-spacing: 0.1em;
      }
      .gap-card .leader strong {
        color: var(--text);
        font-weight: 700;
      }
      .mmr-gap {
        margin-top: 20px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
      }
      .mmr-gap-label {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.2em;
        color: var(--dim);
        text-transform: uppercase;
      }
      .mmr-gap-value {
        font-size: 24px;
        font-weight: 900;
        color: var(--cyan);
      }

      /* Player card */
      .player-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 24px;
        margin-bottom: 12px;
      }
      .player-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .player-name-section {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .player-avatar {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        flex-shrink: 0;
        overflow: hidden;
        border: 2px solid var(--border);
      }
      .player-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }
      .player-name {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .player-name .player-tag {
        color: var(--dim);
        font-weight: 500;
      }
      .ext-link {
        display: inline-block;
        margin-left: 6px;
        padding: 2px 7px;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #4a4b57;
        background: #1c1d26;
        border: 1px solid #2a2b35;
        border-radius: 5px;
        text-decoration: none;
        transition: all 0.15s;
        vertical-align: middle;
      }
      .ext-link:hover {
        color: #8b8d9b;
        border-color: #4a4b57;
      }
      .player-rank-badge {
        font-size: 13px;
        font-weight: 800;
        padding: 6px 14px;
        border-radius: 8px;
        letter-spacing: 0.05em;
      }

      /* Stats row */
      .stats-row {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 2px;
        background: var(--border);
        border-radius: 12px;
        overflow: hidden;
        margin-bottom: 20px;
      }
      .stat {
        background: var(--card2);
        padding: 16px 12px;
        text-align: center;
      }
      .stat-value {
        font-size: 20px;
        font-weight: 800;
        line-height: 1;
        margin-bottom: 4px;
      }
      .stat-label {
        font-size: 9px;
        font-weight: 600;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.15em;
      }

      /* LP Progress bar */
      .mmr-row {
        display: flex;
        gap: 2px;
        margin-bottom: 12px;
        background: var(--border);
        border-radius: 10px;
        overflow: hidden;
      }
      .mmr-block {
        flex: 1;
        background: var(--card2);
        padding: 12px;
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .mmr-label {
        font-size: 9px;
        font-weight: 600;
        color: var(--dim);
        text-transform: uppercase;
        letter-spacing: 0.12em;
      }
      .mmr-value {
        font-size: 15px;
        font-weight: 800;
        color: var(--cyan);
      }
      .mmr-err {
        font-size: 11px;
        font-weight: 500;
        color: var(--dim);
      }

      .lp-progress {
        background: var(--bg);
        border-radius: 10px;
        padding: 16px 20px;
      }
      .lp-progress-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
      }
      .lp-progress-title {
        font-size: 11px;
        font-weight: 600;
        color: var(--dim);
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }
      .lp-progress-value {
        font-size: 14px;
        font-weight: 800;
        color: var(--gold);
      }
      .lp-track {
        width: 100%;
        height: 8px;
        background: var(--border);
        border-radius: 4px;
        position: relative;
        overflow: hidden;
      }
      .lp-fill {
        height: 100%;
        border-radius: 4px;
        transition: width 1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .lp-markers {
        display: flex;
        justify-content: space-between;
        margin-top: 8px;
      }
      .lp-marker {
        font-size: 9px;
        font-weight: 600;
        color: var(--faint);
        letter-spacing: 0.05em;
      }

      .error {
        color: var(--red);
        font-size: 13px;
        text-align: center;
        margin-top: 16px;
        font-weight: 500;
      }

      /* ── Sidebar ── */
      .sidebar {
        width: 320px;
        flex-shrink: 0;
        position: sticky;
        top: 40px;
      }
      .ladder-card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 20px;
        position: relative;
        overflow: hidden;
      }
      .ladder-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 3px;
        background: linear-gradient(90deg, var(--gold), var(--magenta));
      }

      .ladder-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 16px;
      }
      .ladder-title {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.2em;
        color: var(--dim);
        text-transform: uppercase;
      }
      .refresh-btn {
        background: var(--bg);
        border: 1px solid var(--border);
        color: var(--dim);
        width: 28px;
        height: 28px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
        font-family: inherit;
        line-height: 1;
      }
      .refresh-btn:hover:not(:disabled) {
        border-color: var(--gold);
        color: var(--gold);
      }
      .refresh-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      .refresh-btn.spinning {
        animation: spin 0.7s linear infinite;
      }

      /* Cutoffs (stacked vertically) */
      .cutoffs {
        display: flex;
        flex-direction: column;
        gap: 8px;
        margin-bottom: 16px;
      }
      .cutoff-item {
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 12px;
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .cutoff-emblem {
        width: 52px;
        height: 52px;
        object-fit: contain;
        flex-shrink: 0;
        filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
      }
      .cutoff-text {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        min-width: 0;
      }
      .cutoff-tier {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--dim);
      }
      .cutoff-lp {
        font-size: 14px;
        font-weight: 800;
        color: var(--text);
        flex-shrink: 0;
      }
      .cutoff-item.gm .cutoff-tier {
        color: #e74c3c;
      }
      .cutoff-item.chal .cutoff-tier {
        color: #f1c40f;
      }

      /* Ladder divider */
      .ladder-divider {
        height: 1px;
        background: var(--border);
        margin: 12px 0;
      }

      /* Ladder rows */
      .ladder-list {
        display: flex;
        flex-direction: column;
        gap: 0;
      }
      .ladder-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 0;
        border-bottom: 1px solid var(--border);
      }
      .ladder-row:last-child {
        border-bottom: none;
      }

      .ladder-pos {
        font-size: 12px;
        font-weight: 800;
        width: 20px;
        text-align: center;
        flex-shrink: 0;
      }
      .ladder-avatar {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid var(--border);
        flex-shrink: 0;
      }
      .ladder-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .ladder-info {
        flex: 1;
        min-width: 0;
      }
      .ladder-name {
        font-size: 13px;
        font-weight: 700;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ladder-name a {
        color: inherit;
        text-decoration: none;
        transition: color 0.15s;
      }
      .ladder-name a:hover {
        color: var(--gold);
      }
      .ladder-rank-str {
        font-size: 10px;
        color: var(--dim);
        margin-top: 2px;
        font-weight: 500;
      }
      .ladder-tier-dot {
        display: inline-block;
        width: 7px;
        height: 7px;
        border-radius: 50%;
        margin-right: 4px;
        vertical-align: middle;
        position: relative;
        top: -1px;
      }

      .ladder-stats {
        text-align: right;
        flex-shrink: 0;
        min-width: 58px;
      }
      .ladder-wl {
        font-size: 10px;
        font-weight: 700;
        white-space: nowrap;
        margin-bottom: 3px;
      }
      .ladder-w {
        color: var(--green);
      }
      .ladder-l {
        color: var(--red);
      }
      .ladder-sep {
        color: var(--faint);
        margin: 0 2px;
      }
      .ladder-wr-val {
        font-size: 12px;
        font-weight: 800;
      }

      /* Skeleton loading */
      .ladder-skeleton {
        height: 56px;
        background: linear-gradient(
          90deg,
          var(--bg) 25%,
          var(--border) 50%,
          var(--bg) 75%
        );
        background-size: 200% 100%;
        animation: shimmer 1.4s infinite;
        border-radius: 8px;
        margin-bottom: 8px;
      }
      @keyframes shimmer {
        from {
          background-position: 200% center;
        }
        to {
          background-position: -200% center;
        }
      }

      .ladder-footer {
        margin-top: 12px;
        text-align: center;
      }
      .ladder-updated {
        font-size: 9px;
        color: var(--faint);
        letter-spacing: 0.1em;
      }

      /* Ladder error */
      .ladder-error {
        font-size: 11px;
        color: var(--red);
        font-weight: 500;
        padding: 8px 0;
        text-align: center;
      }

      /* Animations */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      /* Responsive */
      @media (max-width: 480px) {
        .stats-row {
          grid-template-columns: repeat(2, 1fr);
        }
        .player-top {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }
      }
      @media (max-width: 860px) {
        .page-layout {
          flex-direction: column;
          align-items: center;
        }
        .sidebar {
          width: 100%;
          max-width: 560px;
          position: static;
        }
        .main-col {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-layout">
      <!-- Main content column -->
      <div class="main-col">
        <div class="header">
          <h1>LP GAP</h1>
          <div class="sub">League Points Comparator</div>
        </div>

        <div class="form">
          <div class="field">
            <label>Jugador 1</label>
            <input
              id="p1"
              placeholder="Nombre#Tag"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="field">
            <label>Jugador 2</label>
            <input
              id="p2"
              placeholder="Nombre#Tag"
              autocomplete="off"
              spellcheck="false"
            />
          </div>
          <div class="field">
            <label>Región</label>
            <div class="regions" id="regions"></div>
          </div>
          <button class="compare-btn" id="btn" disabled>Comparar</button>
        </div>

        <div id="error" class="error" hidden></div>
        <div id="loading" class="loading" hidden>
          <div class="spinner"></div>
          <span id="load-msg">Buscando invocadores...</span>
        </div>
        <div id="results" class="results" hidden></div>
      </div>

      <!-- Sidebar ladder -->
      <aside class="sidebar">
        <div class="ladder-card">
          <div class="ladder-header">
            <span class="ladder-title">Ranking Amigos</span>
            <button class="refresh-btn" id="refresh-btn" title="Actualizar">
              ↻
            </button>
          </div>

          <!-- GM / Challenger cutoffs -->
          <div class="cutoffs">
            <div class="cutoff-item gm">
              <img
                class="cutoff-emblem"
                src="https://opgg-static.akamaized.net/images/medals_new/grandmaster.png"
                alt="Grandmaster"
                onerror="
                  this.onerror = null;
                  this.src =
                    'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-grandmaster.png';
                "
              />
              <div class="cutoff-text">
                <span class="cutoff-tier">Grandmaster</span>
                <span class="cutoff-lp" id="cutoff-gm-lp">— LP</span>
              </div>
            </div>
            <div class="cutoff-item chal">
              <img
                class="cutoff-emblem"
                src="https://opgg-static.akamaized.net/images/medals_new/challenger.png"
                alt="Challenger"
                onerror="
                  this.onerror = null;
                  this.src =
                    'https://raw.communitydragon.org/latest/plugins/rcp-fe-lol-static-assets/global/default/images/ranked-emblem/emblem-challenger.png';
                "
              />
              <div class="cutoff-text">
                <span class="cutoff-tier">Challenger</span>
                <span class="cutoff-lp" id="cutoff-chal-lp">— LP</span>
              </div>
            </div>
          </div>

          <div class="ladder-divider"></div>

          <div class="ladder-list" id="ladder-list">
            <div class="ladder-skeleton"></div>
            <div class="ladder-skeleton"></div>
            <div class="ladder-skeleton"></div>
          </div>

          <div class="ladder-footer">
            <span class="ladder-updated" id="ladder-updated">Cargando...</span>
          </div>
        </div>
      </aside>
    </div>

    <script>
      const REGIONS = [
        { v: "euw", l: "EUW" },
        { v: "eune", l: "EUNE" },
        { v: "na", l: "NA" },
        { v: "kr", l: "KR" },
        { v: "jp", l: "JP" },
        { v: "br", l: "BR" },
        { v: "las", l: "LAS" },
        { v: "lan", l: "LAN" },
        { v: "oce", l: "OCE" },
        { v: "tr", l: "TR" },
      ];
      const TIERS = [
        "IRON",
        "BRONZE",
        "SILVER",
        "GOLD",
        "PLATINUM",
        "EMERALD",
        "DIAMOND",
        "MASTER",
        "GRANDMASTER",
        "CHALLENGER",
      ];
      const DIVS = ["IV", "III", "II", "I"];
      const TIER_COLORS = {
        IRON: { bg: "#8B8589", text: "#fff" },
        BRONZE: { bg: "#CD7F32", text: "#fff" },
        SILVER: { bg: "#9ca3af", text: "#000" },
        GOLD: { bg: "#f0b232", text: "#000" },
        PLATINUM: { bg: "#47C9AF", text: "#000" },
        EMERALD: { bg: "#50C878", text: "#000" },
        DIAMOND: { bg: "#B9F2FF", text: "#000" },
        MASTER: { bg: "#9B59B6", text: "#fff" },
        GRANDMASTER: { bg: "#E74C3C", text: "#fff" },
        CHALLENGER: { bg: "#F1C40F", text: "#000" },
        UNRANKED: { bg: "#3a3b47", text: "#fff" },
      };

      let region = "euw";
      let ddragonVersion = "15.7.1";
      const $p1 = document.getElementById("p1");
      const $p2 = document.getElementById("p2");
      const $btn = document.getElementById("btn");

      fetch("https://ddragon.leagueoflegends.com/api/versions.json")
        .then((r) => r.json())
        .then((v) => {
          if (v && v[0]) ddragonVersion = v[0];
        })
        .catch(() => {});

      function iconUrl(id) {
        return `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/profileicon/${id}.png`;
      }

      // Regions
      const $reg = document.getElementById("regions");
      REGIONS.forEach((r) => {
        const b = document.createElement("button");
        b.textContent = r.l;
        if (r.v === region) b.className = "active";
        b.onclick = () => {
          region = r.v;
          $reg.querySelectorAll("button").forEach((x) => (x.className = ""));
          b.className = "active";
        };
        $reg.appendChild(b);
      });

      function check() {
        $btn.disabled = !($p1.value.includes("#") && $p2.value.includes("#"));
      }
      $p1.addEventListener("input", check);
      $p2.addEventListener("input", check);
      [$p1, $p2].forEach((el) =>
        el.addEventListener("keydown", (e) => {
          if (e.key === "Enter" && !$btn.disabled) compare();
        }),
      );
      $btn.addEventListener("click", compare);

      function toLP(tier, div, lp) {
        const i = TIERS.indexOf((tier || "").toUpperCase());
        if (i < 0) return 0;
        if (i >= 7) return 2800 + (lp || 0);
        const d = DIVS.indexOf((div || "").toUpperCase());
        return i * 400 + Math.max(d, 0) * 100 + (lp || 0);
      }

      function fmtRank(r) {
        if (!r || r.tier === "Unranked") return "UNRANKED";
        const t = r.tier.toUpperCase();
        if (TIERS.indexOf(t) >= 7) return `${r.tier} ${r.lp} LP`;
        return `${r.tier} ${r.division}`;
      }

      function tierKey(r) {
        return r && r.tier !== "Unranked" ? r.tier.toUpperCase() : "UNRANKED";
      }

      function getProgressInfo(r) {
        if (!r || r.tier === "Unranked")
          return {
            label: "UNRANKED",
            pct: 0,
            left: "—",
            right: "—",
            valueTxt: "0 LP",
          };
        const t = r.tier.toUpperCase();
        const idx = TIERS.indexOf(t);

        if (idx >= 7) {
          const lpInTier = r.lp;
          if (idx === 7) {
            return {
              label: "MASTER → CHALLENGER",
              pct: Math.min((lpInTier / 1600) * 100, 100),
              left: "M 0 LP",
              right: "C",
              valueTxt: `${lpInTier} LP`,
            };
          }
          if (idx === 8) {
            return {
              label: "GRANDMASTER",
              pct: Math.min((lpInTier / 1800) * 100, 100),
              left: "GM 0 LP",
              right: "C",
              valueTxt: `${lpInTier} LP`,
            };
          }
          return {
            label: "CHALLENGER",
            pct: 100,
            left: "C",
            right: `${lpInTier} LP`,
            valueTxt: `${lpInTier} LP`,
          };
        }

        const divIdx = DIVS.indexOf((r.division || "").toUpperCase());
        const divLabel = r.division || "IV";
        const pct = Math.min(r.lp, 100);
        return {
          label: `${r.tier} ${divLabel}`,
          pct: pct,
          left: "0 LP",
          right:
            divIdx < 3
              ? `${r.tier} ${DIVS[divIdx + 1]}`
              : TIERS.indexOf(t) < 9
                ? TIERS[TIERS.indexOf(t) + 1].charAt(0) +
                  TIERS[TIERS.indexOf(t) + 1].slice(1).toLowerCase()
                : "—",
          valueTxt: `${r.lp} LP`,
        };
      }

      function esc(s) {
        const d = document.createElement("div");
        d.textContent = s;
        return d.innerHTML;
      }

      async function fetchRank(name, tag, reg) {
        const res = await fetch(
          `/api/rank?name=${encodeURIComponent(name)}&tag=${encodeURIComponent(tag)}&region=${reg}`,
        );
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Error");
        return data;
      }

      async function fetchMMR(name, tag) {
        try {
          const res = await fetch(
            `/api/mmr?name=${encodeURIComponent(name)}&tag=${encodeURIComponent(tag)}&region=${region}`,
          );
          const data = await res.json();
          return data;
        } catch {
          return { ranked: null };
        }
      }

      const MSGS = [
        "Buscando invocadores...",
        "Consultando rangos...",
        "Estimando MMR...",
        "Calculando gap...",
      ];
      let loadIv;
      function setLoading(on) {
        document.getElementById("loading").hidden = !on;
        clearInterval(loadIv);
        if (on) {
          $btn.disabled = true;
          let i = 0;
          loadIv = setInterval(() => {
            i = (i + 1) % MSGS.length;
            document.getElementById("load-msg").textContent = MSGS[i];
          }, 1500);
        } else check();
      }
      function showError(msg) {
        const e = document.getElementById("error");
        e.textContent = msg;
        e.hidden = false;
      }
      function hideError() {
        document.getElementById("error").hidden = true;
      }

      function buildPlayerCard(riotId, r, mmrData) {
        const parts = riotId.split("#");
        const name = esc(parts[0]);
        const tag = esc(parts[1] || "");
        const tk = tierKey(r);
        const tc = TIER_COLORS[tk] || TIER_COLORS.UNRANKED;
        const total = r.wins + r.losses;
        const wrPct = total ? Math.round((r.wins / total) * 100) : 0;
        const wrColor =
          wrPct >= 55
            ? "var(--green)"
            : wrPct >= 50
              ? "var(--text)"
              : "var(--red)";
        const prog = getProgressInfo(r);
        const icon = r.iconId || 29;

        const mmr = mmrData && mmrData.ranked;

        const rawName = parts[0];
        const rawTag = parts[1] || "";
        const opggUrl = `https://www.op.gg/summoners/${region}/${encodeURIComponent(rawName)}-${encodeURIComponent(rawTag)}`;
        const deeplolUrl = `https://www.deeplol.gg/summoner/${region}/${encodeURIComponent(rawName)}-${encodeURIComponent(rawTag)}`;

        let mmrHtml = "";
        if (mmr) {
          mmrHtml = '<div class="mmr-row">';
          mmrHtml += `<div class="mmr-block">
      <span class="mmr-label">Ranked MMR</span>
      <span class="mmr-value">${mmr.mmr.toLocaleString()} <span class="mmr-err">±${mmr.err}</span></span>
    </div>`;
          if (mmr.percentile != null) {
            mmrHtml += `<div class="mmr-block">
        <span class="mmr-label">Percentil</span>
        <span class="mmr-value">Top ${100 - mmr.percentile}%</span>
      </div>`;
          }
          if (mmr.closestRank) {
            mmrHtml += `<div class="mmr-block">
        <span class="mmr-label">MMR ≈ Rango</span>
        <span class="mmr-value">${mmr.closestRank}</span>
      </div>`;
          }
          mmrHtml += "</div>";
        }

        return `
    <div class="player-card">
      <div class="player-top">
        <div class="player-name-section">
          <div class="player-avatar" style="border-color:${tc.bg}">
            <img src="${iconUrl(icon)}" alt="${name}" />
          </div>
          <div>
            <div class="player-name">
              ${name}<span class="player-tag"> #${tag}</span>
              <a href="${opggUrl}" target="_blank" class="ext-link">OP.GG</a>
              <a href="${deeplolUrl}" target="_blank" class="ext-link">DeepLoL</a>
            </div>
          </div>
        </div>
        <div class="player-rank-badge" style="background:${tc.bg};color:${tc.text}">
          ${fmtRank(r)}
        </div>
      </div>

      <div class="stats-row">
        <div class="stat">
          <div class="stat-value">${total}</div>
          <div class="stat-label">Partidas</div>
        </div>
        <div class="stat">
          <div class="stat-value" style="color:${wrColor}">${wrPct}%</div>
          <div class="stat-label">Win Rate</div>
        </div>
        <div class="stat">
          <div class="stat-value" style="color:var(--green)">${r.wins}</div>
          <div class="stat-label">Wins</div>
        </div>
        <div class="stat">
          <div class="stat-value" style="color:var(--red)">${r.losses}</div>
          <div class="stat-label">Losses</div>
        </div>
      </div>

      ${mmrHtml}

      <div class="lp-progress">
        <div class="lp-progress-header">
          <span class="lp-progress-title">${prog.label}</span>
          <span class="lp-progress-value" style="color:${tc.bg}">${prog.valueTxt}</span>
        </div>
        <div class="lp-track">
          <div class="lp-fill" style="width:0%;background:${tc.bg}" data-target="${prog.pct}"></div>
        </div>
        <div class="lp-markers">
          <span class="lp-marker">${prog.left}</span>
          <span class="lp-marker">${prog.right}</span>
        </div>
      </div>
    </div>`;
      }

      async function compare() {
        const id1 = $p1.value.trim().split("#");
        const id2 = $p2.value.trim().split("#");
        if (id1.length !== 2 || id2.length !== 2)
          return showError("Formato: Nombre#Tag");

        hideError();
        document.getElementById("results").hidden = true;
        setLoading(true);

        try {
          const [r1, r2, m1, m2] = await Promise.all([
            fetchRank(id1[0], id1[1], region),
            fetchRank(id2[0], id2[1], region),
            fetchMMR(id1[0], id1[1]),
            fetchMMR(id2[0], id2[1]),
          ]);

          const lp1 = toLP(r1.tier, r1.division, r1.lp);
          const lp2 = toLP(r2.tier, r2.division, r2.lp);
          const diff = Math.abs(lp1 - lp2);
          const leader = lp1 >= lp2 ? 1 : 2;
          const leaderName =
            leader === 1
              ? esc($p1.value.trim().split("#")[0])
              : esc($p2.value.trim().split("#")[0]);

          const mmr1 = m1 && m1.ranked ? m1.ranked.mmr : null;
          const mmr2 = m2 && m2.ranked ? m2.ranked.mmr : null;
          const mmrDiff =
            mmr1 != null && mmr2 != null ? Math.abs(mmr1 - mmr2) : null;

          const box = document.getElementById("results");
          box.innerHTML = `
      <div class="gap-card">
        <div class="label">LP Gap</div>
        <div class="value">${diff === 0 ? "0" : "+" + diff}</div>
        <div class="leader">${
          diff === 0
            ? "Mismo rango"
            : `<strong>${leaderName}</strong> va por delante`
        }</div>
        ${
          mmrDiff != null
            ? `
        <div class="mmr-gap">
          <span class="mmr-gap-label">MMR Gap</span>
          <span class="mmr-gap-value">${mmrDiff === 0 ? "0" : "+" + mmrDiff}</span>
        </div>`
            : ""
        }
      </div>
      ${buildPlayerCard($p1.value.trim(), r1, m1)}
      ${buildPlayerCard($p2.value.trim(), r2, m2)}
    `;
          box.hidden = false;

          requestAnimationFrame(() => {
            setTimeout(() => {
              box.querySelectorAll(".lp-fill").forEach((bar) => {
                bar.style.width = bar.dataset.target + "%";
              });
            }, 80);
          });
        } catch (e) {
          showError(e.message || "Error al buscar datos");
        }
        setLoading(false);
      }

      // ── Ladder ──────────────────────────────────────────────────────────────────

      const LADDER_PLAYERS = [
        "KoldoAbalos#PSOE",
        "ElBachu#123",
        "stellar#ACO",
        "XdestroyersitoX#EUW",
        "MMIAUUU#EUW",
        "xSalva375#EUW",
        "ElPidroIMAX#2538",
        "aco#waifu",
        "LosCocos al aire#wasap",
        "ElmiilloR11#GORDO",
        "SevillanaEnjoyer#CARLA",
        "CAL Destroyersit#EUW",
      ];
      const LADDER_REGION = "euw";
      const LADDER_CACHE_KEY = "lpgap_ladder_v1";
      const LADDER_CACHE_TTL = 5 * 60 * 1000; // 5 min

      // Tamaño de tanda y pausa entre tandas. Cada jugador implica 3 llamadas a
      // Riot internamente (account, summoner, league), así que con BATCH_SIZE=4
      // disparamos como mucho 12 peticiones simultáneas. La pausa de ~1.1s deja
      // margen frente a los 20 req/s y, sumando todas las tandas, también frente
      // al límite de 100 req cada 2 minutos de la dev key.
      const LADDER_BATCH_SIZE = 4;
      const LADDER_BATCH_DELAY_MS = 1100;

      let ladderLastUpdated = null;
      let ladderRefreshing = false;

      function loadLadderCache() {
        try {
          const raw = localStorage.getItem(LADDER_CACHE_KEY);
          if (!raw) return null;
          const data = JSON.parse(raw);
          if (!data.timestamp || Date.now() - data.timestamp > LADDER_CACHE_TTL)
            return null;
          return data;
        } catch {
          return null;
        }
      }

      function saveLadderCache(players, cutoffs) {
        try {
          localStorage.setItem(
            LADDER_CACHE_KEY,
            JSON.stringify({
              players,
              cutoffs,
              timestamp: Date.now(),
            }),
          );
        } catch {}
      }

      async function fetchLadderRank(riotId) {
        const [name, tag] = riotId.split("#");
        try {
          const res = await fetch(
            `/api/rank?name=${encodeURIComponent(name)}&tag=${encodeURIComponent(tag)}&region=${LADDER_REGION}`,
          );
          const data = await res.json();
          if (!res.ok) {
            const isRate = res.status === 429 || /429/.test(data.error || "");
            return {
              riotId,
              error: isRate
                ? "Rate limit (espera 1-2 min)"
                : data.error || `Error ${res.status}`,
            };
          }
          return { riotId, ...data };
        } catch (e) {
          return { riotId, error: "Sin conexión" };
        }
      }

      // Procesa la lista de jugadores en tandas pequeñas con una pausa entre
      // ellas para no saturar la API de Riot. Devuelve los resultados en el
      // mismo orden que la lista original.
      async function fetchLadderInBatches(
        players,
        batchSize = LADDER_BATCH_SIZE,
        delayMs = LADDER_BATCH_DELAY_MS,
      ) {
        const results = [];
        for (let i = 0; i < players.length; i += batchSize) {
          const batch = players.slice(i, i + batchSize);
          const batchResults = await Promise.all(batch.map(fetchLadderRank));
          results.push(...batchResults);
          // Solo pausamos si quedan tandas por delante; evita la espera final.
          if (i + batchSize < players.length) {
            await new Promise((resolve) => setTimeout(resolve, delayMs));
          }
        }
        return results;
      }

      async function fetchCutoffs() {
        try {
          const res = await fetch(`/api/cutoff?region=${LADDER_REGION}`);
          const data = await res.json();
          if (!res.ok) {
            console.warn("[cutoff]", res.status, data);
            return { challengerMin: null, grandmasterMin: null };
          }
          return data;
        } catch (e) {
          console.warn("[cutoff] fetch failed:", e.message);
          return { challengerMin: null, grandmasterMin: null };
        }
      }

      function fmtCutoffLP(v) {
        return typeof v === "number" && v > 0 ? `${v} LP` : "— LP";
      }

      function ladderRankStr(p) {
        if (!p || p.tier === "Unranked") return "Unranked";
        const idx = TIERS.indexOf(p.tier.toUpperCase());
        if (idx >= 7) return `${p.tier} · ${p.lp} LP`;
        return `${p.tier} ${p.division} · ${p.lp} LP`;
      }

      function renderLadder(players, cutoffs) {
        const sorted = [...players].sort((a, b) => {
          if (a.error && b.error) return 0;
          if (a.error) return 1;
          if (b.error) return -1;
          return (
            toLP(b.tier, b.division, b.lp) - toLP(a.tier, a.division, a.lp)
          );
        });

        const posColors = ["var(--gold)", "#9ca3af", "#CD7F32"];

        const listEl = document.getElementById("ladder-list");
        listEl.innerHTML = sorted
          .map((p, i) => {
            if (p.error) {
              const errMsg =
                typeof p.error === "string" ? p.error : "Error al cargar";
              const [errName, errTag] = p.riotId.split("#");
              const errOpgg = `https://www.op.gg/summoners/${LADDER_REGION}/${encodeURIComponent(errName)}-${encodeURIComponent(errTag || "")}`;
              return `<div class="ladder-row">
        <span class="ladder-pos" style="color:${posColors[i] || "var(--dim)"}">#${i + 1}</span>
        <div class="ladder-info" style="margin-left:46px">
          <div class="ladder-name"><a href="${errOpgg}" target="_blank" rel="noopener">${esc(errName)}</a></div>
          <div class="ladder-rank-str" style="color:var(--red)">${esc(errMsg)}</div>
        </div>
      </div>`;
            }

            const tk = tierKey(p);
            const tc = TIER_COLORS[tk] || TIER_COLORS.UNRANKED;
            const total = p.wins + p.losses;
            const wrPct = total ? Math.round((p.wins / total) * 100) : 0;
            const wrColor =
              wrPct >= 55
                ? "var(--green)"
                : wrPct >= 50
                  ? "var(--text)"
                  : "var(--red)";
            const [name, tag] = p.riotId.split("#");
            const opggUrl = `https://www.op.gg/summoners/${LADDER_REGION}/${encodeURIComponent(name)}-${encodeURIComponent(tag || "")}`;

            return `<div class="ladder-row">
      <span class="ladder-pos" style="color:${posColors[i] || "var(--dim)"}">#${i + 1}</span>
      <div class="ladder-avatar" style="border-color:${tc.bg}">
        <img src="${iconUrl(p.iconId || 29)}" alt="${esc(name)}" loading="lazy" />
      </div>
      <div class="ladder-info">
        <div class="ladder-name"><a href="${opggUrl}" target="_blank" rel="noopener">${esc(name)}</a></div>
        <div class="ladder-rank-str">
          <span class="ladder-tier-dot" style="background:${tc.bg}"></span>${ladderRankStr(p)}
        </div>
      </div>
      <div class="ladder-stats">
        <div class="ladder-wl">
          <span class="ladder-w">${p.wins}W</span><span class="ladder-sep">/</span><span class="ladder-l">${p.losses}L</span>
        </div>
        <div class="ladder-wr-val" style="color:${wrColor}">${wrPct}% WR</div>
      </div>
    </div>`;
          })
          .join("");

        // Update cutoff display
        const gmEl = document.getElementById("cutoff-gm-lp");
        const chalEl = document.getElementById("cutoff-chal-lp");
        if (gmEl)
          gmEl.textContent = fmtCutoffLP(cutoffs && cutoffs.grandmasterMin);
        if (chalEl)
          chalEl.textContent = fmtCutoffLP(cutoffs && cutoffs.challengerMin);
      }

      function updateLadderTime() {
        const el = document.getElementById("ladder-updated");
        if (!el) return;
        if (!ladderLastUpdated) {
          el.textContent = "No actualizado";
          return;
        }
        const diff = Math.floor((Date.now() - ladderLastUpdated) / 1000);
        if (diff < 5) el.textContent = "Actualizado ahora";
        else if (diff < 60) el.textContent = `Actualizado hace ${diff}s`;
        else if (diff < 3600)
          el.textContent = `Actualizado hace ${Math.floor(diff / 60)}min`;
        else el.textContent = `Actualizado hace ${Math.floor(diff / 3600)}h`;
      }

      async function refreshLadder(force = false) {
        if (ladderRefreshing) return;

        // Use cache on initial load if fresh — avoids hammering Riot on every F5
        if (!force) {
          const cached = loadLadderCache();
          if (cached) {
            renderLadder(cached.players, cached.cutoffs);
            ladderLastUpdated = cached.timestamp;
            updateLadderTime();
            return;
          }
        }

        ladderRefreshing = true;

        const btn = document.getElementById("refresh-btn");
        btn.classList.add("spinning");
        btn.disabled = true;

        document.getElementById("ladder-list").innerHTML =
          '<div class="ladder-skeleton"></div>' +
          '<div class="ladder-skeleton"></div>' +
          '<div class="ladder-skeleton"></div>';

        // Cargamos los cutoffs en paralelo con la primera tanda. Las peticiones
        // a /api/rank salen escalonadas dentro de fetchLadderInBatches.
        const [players, cutoffs] = await Promise.all([
          fetchLadderInBatches(LADDER_PLAYERS),
          fetchCutoffs(),
        ]);

        renderLadder(players, cutoffs);

        // Cacheamos siempre, aunque algún jugador venga con error. El TTL de
        // 5 min limita lo "rancia" que puede quedar la información, y a cambio
        // evitamos el círculo vicioso anterior: si nunca se cacheaba, cada
        // recarga volvía a disparar todas las peticiones contra Riot.
        saveLadderCache(players, cutoffs);

        ladderLastUpdated = Date.now();
        updateLadderTime();

        btn.classList.remove("spinning");
        btn.disabled = false;
        ladderRefreshing = false;
      }

      document.getElementById("refresh-btn").onclick = () =>
        refreshLadder(true);

      setInterval(updateLadderTime, 30000);
      refreshLadder();
    </script>
  </body>
</html>
