<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LP GAP - Challenge Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: transparent;
        color: #f5e9c8;
        font-family: "Inter", system-ui, sans-serif;
        overflow: hidden;
      }

      body {
        display: inline-block;
        padding: 6px;
      }

      .overlay {
        --accent: #c89b3c;
        --accent-soft: rgba(200, 155, 60, 0.24);
        position: relative;
        display: grid;
        grid-template-columns: minmax(306px, 306px) 116px;
        width: 438px;
        min-height: 82px;
        overflow: hidden;
        border: 1px solid rgba(200, 155, 60, 0.36);
        border-radius: 10px;
        background:
          linear-gradient(180deg, rgba(18, 20, 31, 0.96), rgba(8, 10, 17, 0.96)),
          rgba(8, 10, 17, 0.96);
        box-shadow:
          0 6px 22px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
      }

      .overlay::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, #d177ff 0%, #c89b3c 48%, #62d68a 100%);
        opacity: 0.9;
        z-index: 3;
      }

      .carousel {
        position: relative;
        height: 82px;
        overflow: hidden;
      }

      .player-slide {
        --tier-accent: #c89b3c;
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: 44px minmax(0, 1fr) 66px;
        align-items: center;
        gap: 12px;
        padding: 12px 14px 10px 14px;
        opacity: 0;
        transform: translateY(110%);
        transition:
          transform 540ms cubic-bezier(0.22, 0.8, 0.22, 1),
          opacity 280ms ease;
      }

      .player-slide.active {
        opacity: 1;
        transform: translateY(0);
      }

      .player-slide.off-up,
      .player-slide.exit-up {
        opacity: 0;
        transform: translateY(-110%);
      }

      .player-slide.off-down,
      .player-slide.exit-down {
        opacity: 0;
        transform: translateY(110%);
      }

      .avatar {
        width: 42px;
        height: 42px;
        overflow: hidden;
        border: 2px solid var(--tier-accent);
        border-radius: 9px;
        background: #171922;
        box-shadow: 0 0 14px rgba(0, 0, 0, 0.25);
      }

      .avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .identity {
        min-width: 0;
      }

      .name-row {
        display: flex;
        align-items: center;
        gap: 7px;
        min-width: 0;
      }

      .medal {
        width: 18px;
        flex: 0 0 18px;
        font-size: 17px;
        line-height: 1;
        text-align: center;
      }

      .player-name {
        overflow: hidden;
        color: #f7f1df;
        font-size: 14px;
        font-weight: 900;
        line-height: 1;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .player-rank {
        margin-top: 6px;
        overflow: hidden;
        color: var(--tier-accent);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.16em;
        line-height: 1;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .player-role {
        margin-top: 7px;
        overflow: hidden;
        color: rgba(245, 233, 200, 0.56);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.12em;
        line-height: 1;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .lp-block {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .lp-value {
        color: var(--tier-accent);
        font-size: 24px;
        font-weight: 900;
        line-height: 1;
        text-shadow: 0 0 18px rgba(240, 178, 50, 0.36);
      }

      .lp-unit {
        display: block;
        margin-top: 5px;
        color: rgba(245, 233, 200, 0.56);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.16em;
        line-height: 1;
      }

      .wl {
        display: block;
        margin-top: 6px;
        color: rgba(245, 233, 200, 0.58);
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.05em;
        line-height: 1;
      }

      .gap-panel {
        position: relative;
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        border-left: 1px solid rgba(200, 155, 60, 0.25);
        background:
          radial-gradient(circle at 50% 20%, rgba(240, 178, 50, 0.14), transparent 58%),
          rgba(255, 255, 255, 0.02);
      }

      .gap-label {
        color: rgba(245, 233, 200, 0.56);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.28em;
        line-height: 1;
        text-transform: uppercase;
      }

      .gap-value {
        margin-top: 5px;
        color: #f0b232;
        font-size: 27px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-shadow: 0 0 18px rgba(240, 178, 50, 0.42);
      }

      .gap-leader {
        max-width: 92px;
        margin-top: 6px;
        overflow: hidden;
        color: rgba(245, 233, 200, 0.66);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.11em;
        line-height: 1;
        text-align: center;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .player-slide[data-tier="iron"] {
        --tier-accent: #b8b6b0;
      }
      .player-slide[data-tier="bronze"] {
        --tier-accent: #cd7f32;
      }
      .player-slide[data-tier="silver"] {
        --tier-accent: #c0c4c8;
      }
      .player-slide[data-tier="gold"] {
        --tier-accent: #f0b232;
      }
      .player-slide[data-tier="platinum"] {
        --tier-accent: #47c9af;
      }
      .player-slide[data-tier="emerald"] {
        --tier-accent: #62d68a;
      }
      .player-slide[data-tier="diamond"] {
        --tier-accent: #b9f2ff;
      }
      .player-slide[data-tier="master"] {
        --tier-accent: #d177ff;
      }
      .player-slide[data-tier="grandmaster"] {
        --tier-accent: #ff8a8a;
      }
      .player-slide[data-tier="challenger"] {
        --tier-accent: #fae26c;
      }
      .player-slide[data-tier="unranked"] {
        --tier-accent: #7d8190;
      }

      .pulse-update {
        animation: pulse 650ms ease-out;
      }

      @keyframes pulse {
        0% {
          box-shadow:
            0 6px 22px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.04),
            0 0 0 0 rgba(240, 200, 100, 0.58);
        }
        100% {
          box-shadow:
            0 6px 22px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.04),
            0 0 0 22px rgba(240, 200, 100, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .player-slide {
          transition: opacity 180ms ease;
        }
      }
    </style>
  </head>
  <body>
    <div class="overlay" id="bar">
      <div class="carousel" id="carousel">
        <section class="player-slide active" id="p1" data-tier="unranked">
          <div class="avatar"><img id="p1-avatar" alt="" /></div>
          <div class="identity">
            <div class="name-row">
              <span class="medal" id="p1-medal">-</span>
              <span class="player-name">Sevillana</span>
            </div>
            <div class="player-rank" id="p1-rank">CARGANDO</div>
            <div class="player-role" id="p1-role">SOLOQ CHALLENGE</div>
          </div>
          <div class="lp-block">
            <div class="lp-value" id="p1-lp">-</div>
            <span class="lp-unit">LP</span>
            <span class="wl" id="p1-wl">0W / 0L</span>
          </div>
        </section>

        <section class="player-slide off-down" id="p2" data-tier="unranked">
          <div class="avatar"><img id="p2-avatar" alt="" /></div>
          <div class="identity">
            <div class="name-row">
              <span class="medal" id="p2-medal">-</span>
              <span class="player-name">CAL</span>
            </div>
            <div class="player-rank" id="p2-rank">CARGANDO</div>
            <div class="player-role" id="p2-role">SOLOQ CHALLENGE</div>
          </div>
          <div class="lp-block">
            <div class="lp-value" id="p2-lp">-</div>
            <span class="lp-unit">LP</span>
            <span class="wl" id="p2-wl">0W / 0L</span>
          </div>
        </section>
      </div>

      <aside class="gap-panel">
        <div class="gap-label">GAP</div>
        <div class="gap-value" id="gap">0</div>
        <div class="gap-leader" id="leader">CARGANDO</div>
      </aside>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const refreshMs =
        Math.max(30, parseInt(params.get("refresh") || "60", 10)) * 1000;
      const cycleMs =
        Math.max(3, parseInt(params.get("cycle") || "5", 10)) * 1000;
      const direction = params.get("direction") === "down" ? "down" : "up";

      const REGION = "euw";
      const PLAYERS = [
        {
          riot: "SevillanaEnjoyer#CARLA",
          short: "Sevillana",
          full: "SevillanaEnjoyer",
          id: "p1",
        },
        {
          riot: "CAL Destroyersit#EUW",
          short: "CAL",
          full: "CAL Destroyersit",
          id: "p2",
        },
      ];

      const TIERS = [
        "IRON",
        "BRONZE",
        "SILVER",
        "GOLD",
        "PLATINUM",
        "EMERALD",
        "DIAMOND",
        "MASTER",
        "GRANDMASTER",
        "CHALLENGER",
      ];
      const DIVS = ["IV", "III", "II", "I"];

      let ddragonVersion = "15.7.1";
      let activeIndex = 0;
      let lastGap = null;
      let lastTotals = [null, null];

      fetch("https://ddragon.leagueoflegends.com/api/versions.json")
        .then((r) => r.json())
        .then((v) => {
          if (v && v[0]) ddragonVersion = v[0];
        })
        .catch(() => {});

      function offClass() {
        return direction === "down" ? "off-up" : "off-down";
      }

      function exitClass() {
        return direction === "down" ? "exit-down" : "exit-up";
      }

      function rotatePlayer() {
        const nextIndex = (activeIndex + 1) % PLAYERS.length;
        const current = document.getElementById(PLAYERS[activeIndex].id);
        const next = document.getElementById(PLAYERS[nextIndex].id);
        next.className = `player-slide ${offClass()}`;

        requestAnimationFrame(() => {
          current.className = `player-slide ${exitClass()}`;
          next.className = "player-slide active";
        });

        setTimeout(() => {
          current.className = `player-slide ${offClass()}`;
        }, 620);

        activeIndex = nextIndex;
      }

      function totalLp(tier, division, lp) {
        const i = TIERS.indexOf((tier || "").toUpperCase());
        if (i < 0) return 0;
        if (i >= 7) return 2800 + (lp || 0);
        const d = DIVS.indexOf((division || "").toUpperCase());
        return i * 400 + Math.max(d, 0) * 100 + (lp || 0);
      }

      function rankLabel(r) {
        if (!r || r.tier === "Unranked") return "UNRANKED";
        const t = (r.tier || "").toUpperCase();
        if (TIERS.indexOf(t) >= 7) return t;
        return `${t} ${r.division || ""}`.trim();
      }

      async function fetchRank(riot) {
        const idx = riot.indexOf("#");
        const name = idx >= 0 ? riot.slice(0, idx) : riot;
        const tag = idx >= 0 ? riot.slice(idx + 1) : "";
        const res = await fetch(
          `/api/rank?name=${encodeURIComponent(name)}&tag=${encodeURIComponent(tag)}&region=${REGION}`,
        );
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "error");
        return data;
      }

      function applyPlayer(slotId, data) {
        const slide = document.getElementById(slotId);
        const tierLow = (data.tier || "unranked").toLowerCase();
        slide.dataset.tier = tierLow;

        document.getElementById(`${slotId}-rank`).textContent = rankLabel(data);
        document.getElementById(`${slotId}-lp`).textContent =
          data.tier === "Unranked" ? "-" : data.lp;
        document.getElementById(`${slotId}-wl`).textContent =
          `${data.wins || 0}W / ${data.losses || 0}L`;

        const iconId = data.iconId || 29;
        document.getElementById(`${slotId}-avatar`).src =
          `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/profileicon/${iconId}.png`;
      }

      function applyRoles(lps) {
        const gap = Math.abs(lps[0] - lps[1]);
        const leaderIdx = lps[0] >= lps[1] ? 0 : 1;
        const trailerIdx = 1 - leaderIdx;

        document.getElementById("gap").textContent = gap === 0 ? "0" : `+${gap}`;
        document.getElementById("leader").textContent =
          gap === 0 ? "EMPATE" : PLAYERS[leaderIdx].short;

        PLAYERS.forEach((p) => {
          document.getElementById(`${p.id}-medal`).textContent =
            gap === 0 ? "🤝" : "-";
          document.getElementById(`${p.id}-role`).textContent =
            gap === 0 ? "EMPATE TECNICO" : "SOLOQ CHALLENGE";
        });

        if (gap > 0) {
          document.getElementById(`${PLAYERS[leaderIdx].id}-medal`).textContent =
            "🥇";
          document.getElementById(`${PLAYERS[leaderIdx].id}-role`).textContent =
            `LIDER +${gap}`;
          document.getElementById(`${PLAYERS[trailerIdx].id}-medal`).textContent =
            "🥈";
          document.getElementById(`${PLAYERS[trailerIdx].id}-role`).textContent =
            `PERSIGUE -${gap}`;
        }
      }

      function pulseIfChanged(lps, gap) {
        const totalsChanged = lps.some((lp, i) => lastTotals[i] !== null && lp !== lastTotals[i]);
        if (lastGap !== null && (gap !== lastGap || totalsChanged)) {
          const bar = document.getElementById("bar");
          bar.classList.remove("pulse-update");
          void bar.offsetWidth;
          bar.classList.add("pulse-update");
        }
        lastGap = gap;
        lastTotals = lps;
      }

      async function tick() {
        try {
          const results = await Promise.all(
            PLAYERS.map((p) =>
              fetchRank(p.riot).catch((e) => ({ error: e.message })),
            ),
          );

          PLAYERS.forEach((p, i) => {
            const data = results[i];
            if (data.error) {
              document.getElementById(`${p.id}-rank`).textContent = "ERROR";
              document.getElementById(`${p.id}-role`).textContent = data.error;
              return;
            }
            applyPlayer(p.id, data);
          });

          const lps = results.map((data) =>
            data && !data.error ? totalLp(data.tier, data.division, data.lp) : null,
          );
          if (lps[0] !== null && lps[1] !== null) {
            const gap = Math.abs(lps[0] - lps[1]);
            applyRoles(lps);
            pulseIfChanged(lps, gap);
          }
        } catch (e) {
          console.error("overlay challenge:", e);
        }
      }

      tick();
      setInterval(tick, refreshMs);
      setInterval(rotatePlayer, cycleMs);
    </script>
  </body>
</html>
