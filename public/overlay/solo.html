<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LP GAP - Solo Overlay</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        background: transparent;
        color: #f5e9c8;
        font-family: "Inter", system-ui, sans-serif;
        overflow: hidden;
      }

      body {
        display: inline-block;
        padding: 6px;
      }

      .bar {
        --accent: #c89b3c;
        position: relative;
        display: grid;
        grid-template-columns: 46px 292px 8px;
        align-items: center;
        gap: 13px;
        width: 381px;
        min-height: 76px;
        padding: 10px 12px;
        overflow: hidden;
        border: 1px solid rgba(200, 155, 60, 0.35);
        border-radius: 10px;
        background:
          linear-gradient(180deg, rgba(14, 17, 27, 0.94), rgba(8, 10, 17, 0.94)),
          rgba(8, 10, 17, 0.94);
        box-shadow:
          0 6px 22px rgba(0, 0, 0, 0.55),
          inset 0 1px 0 rgba(255, 255, 255, 0.04);
        backdrop-filter: blur(8px);
      }

      .bar::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 2px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: 0.86;
      }

      .avatar {
        width: 44px;
        height: 44px;
        border: 2px solid var(--accent);
        border-radius: 9px;
        overflow: hidden;
        background: #16171e;
        box-shadow: 0 0 14px rgba(0, 0, 0, 0.24);
      }

      .avatar img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .carousel {
        position: relative;
        height: 54px;
        overflow: hidden;
        min-width: 0;
      }

      .slide {
        position: absolute;
        inset: 0;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 86px;
        align-items: center;
        gap: 14px;
        opacity: 0;
        transform: translateY(110%);
        transition:
          transform 520ms cubic-bezier(0.22, 0.8, 0.22, 1),
          opacity 240ms ease;
      }

      .slide.active {
        opacity: 1;
        transform: translateY(0);
      }

      .slide.off-up,
      .slide.exit-up {
        opacity: 0;
        transform: translateY(-110%);
      }

      .slide.off-down,
      .slide.exit-down {
        opacity: 0;
        transform: translateY(110%);
      }

      .identity,
      .copy {
        min-width: 0;
      }

      .name-row {
        display: flex;
        align-items: baseline;
        gap: 5px;
        min-width: 0;
        line-height: 1;
      }

      .name {
        overflow: hidden;
        color: #f7f1df;
        font-size: 14px;
        font-weight: 900;
        letter-spacing: 0.02em;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .tag {
        flex-shrink: 0;
        color: rgba(245, 233, 200, 0.45);
        font-size: 10px;
        font-weight: 800;
      }

      .kicker {
        color: rgba(245, 233, 200, 0.52);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.18em;
        line-height: 1;
        text-transform: uppercase;
      }

      .label {
        margin-top: 7px;
        overflow: hidden;
        color: var(--accent);
        font-size: 10px;
        font-weight: 900;
        letter-spacing: 0.15em;
        line-height: 1;
        text-overflow: ellipsis;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .big {
        color: var(--accent);
        font-size: 26px;
        font-weight: 900;
        font-variant-numeric: tabular-nums;
        line-height: 1;
        text-align: right;
        text-shadow: 0 0 18px rgba(240, 178, 50, 0.28);
        white-space: nowrap;
      }

      .unit {
        display: block;
        margin-top: 5px;
        color: rgba(245, 233, 200, 0.56);
        font-size: 9px;
        font-weight: 900;
        letter-spacing: 0.16em;
        line-height: 1;
        text-align: right;
        text-transform: uppercase;
      }

      .delta.up,
      .good {
        color: #6ce8a3;
      }

      .delta.down,
      .bad {
        color: #ff8197;
      }

      .delta.flat {
        color: rgba(245, 233, 200, 0.5);
      }

      .dots {
        display: flex;
        flex-direction: column;
        gap: 5px;
        align-items: center;
        justify-content: center;
      }

      .dots span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: rgba(245, 233, 200, 0.22);
      }

      .dots span.active {
        background: var(--accent);
      }

      .bar[data-tier="iron"] {
        --accent: #b8b6b0;
      }
      .bar[data-tier="bronze"] {
        --accent: #cd7f32;
      }
      .bar[data-tier="silver"] {
        --accent: #c0c4c8;
      }
      .bar[data-tier="gold"] {
        --accent: #f0b232;
      }
      .bar[data-tier="platinum"] {
        --accent: #47c9af;
      }
      .bar[data-tier="emerald"] {
        --accent: #62d68a;
      }
      .bar[data-tier="diamond"] {
        --accent: #b9f2ff;
      }
      .bar[data-tier="master"] {
        --accent: #d177ff;
      }
      .bar[data-tier="grandmaster"] {
        --accent: #ff8a8a;
      }
      .bar[data-tier="challenger"] {
        --accent: #fae26c;
      }

      .pulse-update {
        animation: pulse 0.65s ease-out;
      }

      @keyframes pulse {
        0% {
          box-shadow:
            0 6px 22px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.04),
            0 0 0 0 rgba(240, 200, 100, 0.6);
        }
        100% {
          box-shadow:
            0 6px 22px rgba(0, 0, 0, 0.55),
            inset 0 1px 0 rgba(255, 255, 255, 0.04),
            0 0 0 22px rgba(240, 200, 100, 0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .slide {
          transition: opacity 180ms ease;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar" id="bar" data-tier="unranked">
      <div class="avatar"><img id="avatar" alt="" /></div>

      <div class="carousel">
        <section class="slide active" id="slide-rank">
          <div class="identity">
            <div class="name-row">
              <span class="name" id="name">...</span>
              <span class="tag" id="tag"></span>
            </div>
            <div class="label" id="rank">CARGANDO</div>
          </div>
          <div>
            <div class="big" id="lp">-</div>
            <span class="unit">LP</span>
          </div>
        </section>

        <section class="slide off-down" id="slide-session">
          <div class="copy">
            <div class="kicker">Sesion</div>
            <div class="label" id="session-games">0 partidas</div>
          </div>
          <div>
            <div class="big delta flat" id="delta">0</div>
            <span class="unit">LP</span>
          </div>
        </section>

        <section class="slide off-down" id="slide-total">
          <div class="copy">
            <div class="kicker">Total ranked</div>
            <div class="label" id="wl">0W / 0L</div>
          </div>
          <div>
            <div class="big" id="wrPct">0%</div>
            <span class="unit">WR</span>
          </div>
        </section>
      </div>

      <div class="dots" aria-hidden="true">
        <span class="active"></span>
        <span></span>
        <span></span>
      </div>
    </div>

    <script>
      const params = new URLSearchParams(location.search);
      const riot = (params.get("riot") || "").trim();
      const region = (params.get("region") || "euw").trim();
      const refreshMs =
        Math.max(30, parseInt(params.get("refresh") || "60", 10)) * 1000;
      const cycleMs =
        Math.max(3, parseInt(params.get("cycle") || "8", 10)) * 1000;
      const direction = params.get("direction") === "down" ? "down" : "up";

      const idx = riot.indexOf("#");
      const riotName = idx >= 0 ? riot.slice(0, idx).trim() : riot;
      const riotTag = idx >= 0 ? riot.slice(idx + 1).trim() : "";

      const TIERS = [
        "IRON",
        "BRONZE",
        "SILVER",
        "GOLD",
        "PLATINUM",
        "EMERALD",
        "DIAMOND",
        "MASTER",
        "GRANDMASTER",
        "CHALLENGER",
      ];
      const DIVS = ["IV", "III", "II", "I"];

      let ddragonVersion = "15.7.1";
      let initial = null;
      let lastLp = null;
      let activeIndex = 0;
      const slides = Array.from(document.querySelectorAll(".slide"));
      const dots = Array.from(document.querySelectorAll(".dots span"));

      fetch("https://ddragon.leagueoflegends.com/api/versions.json")
        .then((r) => r.json())
        .then((v) => {
          if (v && v[0]) ddragonVersion = v[0];
        })
        .catch(() => {});

      function offClass() {
        return direction === "down" ? "off-up" : "off-down";
      }

      function exitClass() {
        return direction === "down" ? "exit-down" : "exit-up";
      }

      function rotateSlide() {
        const nextIndex = (activeIndex + 1) % slides.length;
        const current = slides[activeIndex];
        const next = slides[nextIndex];
        next.className = `slide ${offClass()}`;

        requestAnimationFrame(() => {
          current.className = `slide ${exitClass()}`;
          next.className = "slide active";
        });

        setTimeout(() => {
          current.className = `slide ${offClass()}`;
        }, 620);

        activeIndex = nextIndex;
        dots.forEach((dot, i) => dot.classList.toggle("active", i === activeIndex));
      }

      function totalLp(tier, division, lp) {
        const i = TIERS.indexOf((tier || "").toUpperCase());
        if (i < 0) return 0;
        if (i >= 7) return 2800 + (lp || 0);
        const d = DIVS.indexOf((division || "").toUpperCase());
        return i * 400 + Math.max(d, 0) * 100 + (lp || 0);
      }

      function rankLabel(r) {
        if (!r || r.tier === "Unranked") return "UNRANKED";
        const t = (r.tier || "").toUpperCase();
        if (TIERS.indexOf(t) >= 7) return t;
        return `${t} ${r.division || ""}`.trim();
      }

      function showError(msg) {
        document.getElementById("rank").textContent = msg;
      }

      function signed(value) {
        return value > 0 ? `+${value}` : String(value);
      }

      async function tick() {
        if (!riotName || !riotTag) {
          document.getElementById("name").textContent = "Falta ?riot=";
          showError("Configura ?riot=Nombre%23Tag");
          return;
        }

        try {
          const res = await fetch(
            `/api/rank?name=${encodeURIComponent(riotName)}&tag=${encodeURIComponent(riotTag)}&region=${region}`,
          );
          const data = await res.json();
          if (!res.ok) throw new Error(data.error || "error");

          const tierLow = (data.tier || "unranked").toLowerCase();
          const bar = document.getElementById("bar");
          bar.dataset.tier = tierLow;

          document.getElementById("name").textContent = riotName;
          document.getElementById("tag").textContent = riotTag ? `#${riotTag}` : "";
          document.getElementById("rank").textContent = rankLabel(data);
          document.getElementById("lp").textContent =
            data.tier === "Unranked" ? "-" : data.lp;

          const wins = data.wins || 0;
          const losses = data.losses || 0;
          const total = wins + losses;
          const wrPct = total ? Math.round((wins / total) * 100) : 0;
          document.getElementById("wrPct").textContent = `${wrPct}%`;
          document.getElementById("wl").textContent = `${wins}W / ${losses}L`;

          const lp = totalLp(data.tier, data.division, data.lp);
          if (!initial) {
            initial = { lp, wins, losses };
          }

          const sessionDelta = lp - initial.lp;
          const sessionWins = wins - initial.wins;
          const sessionLosses = losses - initial.losses;
          const sessionGames = sessionWins + sessionLosses;
          const sessionText =
            sessionGames === 1
              ? `1 partida - ${sessionWins}W/${sessionLosses}L`
              : `${sessionGames} partidas - ${sessionWins}W/${sessionLosses}L`;
          const delta = document.getElementById("delta");
          delta.classList.remove("up", "down", "flat");
          delta.textContent = signed(sessionDelta);
          if (sessionDelta > 0) delta.classList.add("up");
          else if (sessionDelta < 0) delta.classList.add("down");
          else delta.classList.add("flat");
          document.getElementById("session-games").textContent = sessionText;

          if (lastLp !== null && lp !== lastLp) {
            bar.classList.remove("pulse-update");
            void bar.offsetWidth;
            bar.classList.add("pulse-update");
          }
          lastLp = lp;

          const iconId = data.iconId || 29;
          document.getElementById("avatar").src =
            `https://ddragon.leagueoflegends.com/cdn/${ddragonVersion}/img/profileicon/${iconId}.png`;
        } catch (e) {
          showError("Error: " + e.message);
          console.error("overlay solo:", e);
        }
      }

      tick();
      setInterval(tick, refreshMs);
      setInterval(rotateSlide, cycleMs);
    </script>
  </body>
</html>
